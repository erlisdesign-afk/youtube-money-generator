<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Money Generator - IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            grid-column: 1 / -1;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }

        .result-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .result-content {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #51cf66;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .download-btn {
            background: #51cf66;
            margin-top: 15px;
        }

        .download-btn:hover {
            box-shadow: 0 10px 20px rgba(81, 207, 102, 0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube Money Generator</h1>
            <p>Crea tu estrategia de monetización con IA en segundos</p>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>📝 Cuéntame sobre ti</h2>

                <div class="form-group">
                    <label for="apiKey">🔑 API Key de Claude *</label>
                    <input type="password" id="apiKey" placeholder="sk-ant-..." required>
                    <small style="color: #999; display: block; margin-top: 5px;">
                        <a href="https://console.anthropic.com/account/keys" target="_blank" style="color: #667eea;">Obtén tu API Key gratis aquí</a>
                    </small>
                </div>

                <div class="form-group">
                    <label for="age">¿Cuántos años tienes? *</label>
                    <input type="number" id="age" placeholder="25" required>
                </div>

                <div class="form-group">
                    <label for="interests">¿Cuáles son tus intereses principales? *</label>
                    <textarea id="interests" placeholder="Ej: tecnología, finanzas, desarrollo personal, gaming..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="budget">¿Cuánto presupuesto tienes? *</label>
                    <select id="budget" required>
                        <option value="">Selecciona una opción</option>
                        <option value="$0">$0 (completamente gratis)</option>
                        <option value="$50-100">$50-100</option>
                        <option value="$100-500">$100-500</option>
                        <option value="$500+">$500+</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="hoursPerWeek">¿Cuántas horas/semana tienes disponibles? *</label>
                    <input type="number" id="hoursPerWeek" placeholder="10" required>
                </div>

                <button class="btn" onclick="generateContent()">
                    ✨ Generar mi Estrategia Completa
                </button>
            </div>

            <div class="card" id="resultsPanel" style="display: none;">
                <h2>📊 Tus Resultados</h2>
                <div id="resultsContent"></div>
            </div>
        </div>

        <div id="allResults"></div>
    </div>

    <script>
        const API_ENDPOINT = 'https://api.anthropic.com/v1/messages';
        let allResultsGlobal = {};

        async function generateContent() {
            const apiKey = document.getElementById('apiKey').value;
            const age = document.getElementById('age').value;
            const interests = document.getElementById('interests').value;
            const budget = document.getElementById('budget').value;
            const hoursPerWeek = document.getElementById('hoursPerWeek').value;

            if (!apiKey || !age || !interests || !budget || !hoursPerWeek) {
                showError('Por favor completa todos los campos');
                return;
            }

            const btnElement = event.target;
            btnElement.disabled = true;
            btnElement.innerHTML = '⏳ Generando...';

            try {
                const allResults = {};

                // 1. Análisis de Niches
                console.log('Generando análisis de niches...');
                allResults.niches = await callClaude(apiKey, `
                    Tengo ${age} años y me interesan: ${interests}
                    Presupuesto: ${budget}
                    Disponibilidad: ${hoursPerWeek} horas/semana

                    Analiza y dame:
                    1. Top 5 niches de YouTube con mayor CPM
                    2. Cuál es el mejor para mi edad e intereses
                    3. Análisis de competencia para cada nicho
                    4. Potencial de ingresos realista (1K, 10K, 100K suscriptores)
                    5. Cuál puedo empezar HOY con presupuesto ${budget}

                    Ordena por: más fácil de monetizar y más rápido.
                `);

                // 2. Sistema de Video Faceless
                console.log('Generando sistema de video faceless...');
                allResults.facelessSystem = await callClaude(apiKey, `
                    Based on the top niche from above, create a complete faceless video concept:
                    * SEO-optimized title
                    * Full script (no camera needed)
                    * Voiceover instructions
                    * Stock footage keywords
                    * Background music mood
                    * Thumbnail concept
                    * Estimated CPM
                    * Monetization angle beyond AdSense
                `);

                // 3. Títulos Virales
                console.log('Generando títulos virales...');
                allResults.titles = await callClaude(apiKey, `
                    Para un canal de ${interests}, genera 20 títulos que se volverán virales:
                    * 5 títulos con gap de curiosidad
                    * 5 títulos basados en números
                    * 5 títulos con miedo/urgencia
                    * 5 títulos de transformación

                    Para cada título:
                    - CTR predicho (1-10)
                    - Emoción que dispara
                    - Estilo de thumbnail que combina
                    - Fortaleza SEO

                    Ordena del más al menos viral.
                `);

                // 4. Automatización IA
                console.log('Generando sistema de automatización...');
                allResults.automation = await callClaude(apiKey, `
                    Diseña un sistema completo de automatización para YouTube con presupuesto ${budget}:
                    * Herramientas IA gratuitas para cada paso
                    * Workflow Script → Voiceover → Edición → Thumbnail
                    * Tiempo por video (objetivo: menos de 2 horas)
                    * Sistema de producción en batch (1 mes de contenido)
                    * Calendario de subidas para máximo algoritmo
                    * Cómo manejar 3 canales simultáneamente
                    * Cuándo reinvertir primeros ganancias
                `);

                // 5. Múltiples Fuentes de Ingreso
                console.log('Generando análisis de ingresos...');
                allResults.income = await callClaude(apiKey, `
                    Para un canal sobre ${interests}, construye un blueprint de ingresos:
                    * Estimación de ingresos por AdSense
                    * Top 10 programas de afiliados
                    * Ideas de productos digitales
                    * Tarjeta de precios de sponsorships
                    * Potencial de merchandise
                    * Modelo de comunidad pago
                    * Oportunidad de cursos/coaching

                    Muestra ingresos realistas en: 1K, 5K, 10K, 50K suscriptores
                `);

                // 6. Hack del Algoritmo
                console.log('Generando estrategia de algoritmo...');
                allResults.algorithm = await callClaude(apiKey, `
                    Analiza el algoritmo actual de YouTube para ${interests}:
                    * Duración ideal de video
                    * Frecuencia óptima de subidas
                    * Estrategia de tags que funciona 2025
                    * Enfoque A/B testing de thumbnails
                    * Cómo disparar el algoritmo de videos sugeridos
                    * Estrategia de community posts
                    * Estrategia de Shorts
                    * Estrategia de primeras 24 horas

                    Dame un checklist semanal que pueda seguir.
                `);

                // 7. Roadmap 90 Días
                console.log('Generando roadmap de 90 días...');
                allResults.roadmap = await callClaude(apiKey, `
                    Tengo ${age} años, ${hoursPerWeek} horas/semana, presupuesto ${budget}
                    Intereses: ${interests}

                    Crea mi roadmap completo de 90 días para monetizar YouTube:

                    Semana 1-2: [Setup y primeros videos]
                    Semana 3-4: [Tácticas de crecimiento]
                    Mes 2: [Preparar monetización]
                    Mes 3: [Primer ingreso]

                    Incluye:
                    ✅ Checklist diario de acciones
                    ✅ Objetivos semanales de suscriptores
                    ✅ Fecha estimada de primer ingreso
                    ✅ Hitos de $100, $500, $1000
                    ✅ Qué hacer cuando se estanca crecimiento
                    ✅ Errores más grandes a evitar
                    ✅ Herramientas necesarias en cada etapa
                `);

                allResultsGlobal = allResults;
                displayResults(allResults);
                btnElement.innerHTML = '✨ Generar mi Estrategia Completa';
                btnElement.disabled = false;

            } catch (error) {
                console.error('Error:', error);
                showError('Error: ' + error.message);
                btnElement.innerHTML = '✨ Generar mi Estrategia Completa';
                btnElement.disabled = false;
            }
        }

        async function callClaude(apiKey, prompt) {
            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-3-5-sonnet-20241022',
                        max_tokens: 2000,
                        messages: [
                            {
                                role: 'user',
                                content: prompt
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'Error en la API');
                }

                const data = await response.json();
                return data.content[0].text;
            } catch (error) {
                if (error.message.includes('CORS') || error.message.includes('fetch')) {
                    throw new Error('API Key inválida o sin permisos. Verifica tu API Key en https://console.anthropic.com/account/keys');
                }
                throw error;
            }
        }

        function displayResults(results) {
            const container = document.getElementById('allResults');
            container.innerHTML = '';

            const titles = [
                { key: 'niches', label: '💰 Top 5 Niches' },
                { key: 'facelessSystem', label: '🎥 Sistema Faceless' },
                { key: 'titles', label: '✨ Títulos Virales' },
                { key: 'automation', label: '⚙️ Automatización IA' },
                { key: 'income', label: '💸 Múltiples Ingresos' },
                { key: 'algorithm', label: '🔍 Hack del Algoritmo' },
                { key: 'roadmap', label: '🗺️ Roadmap 90 Días' }
            ];

            let html = '<div class="card results"><h2>📊 Tu Estrategia Completa</h2>';
            html += '<div class="tabs" id="tabs">';

            titles.forEach((item, index) => {
                html += `<button class="tab-btn ${index === 0 ? 'active' : ''}" onclick="switchTab('tab-${item.key}')">
                    ${item.label}
                </button>`;
            });

            html += '</div>';

            titles.forEach((item, index) => {
                html += `<div id="tab-${item.key}" class="tab-content ${index === 0 ? 'active' : ''}">
                    <div class="result-content">${escapeHtml(results[item.key])}</div>
                    <button class="btn download-btn" onclick="downloadResult('${item.label}', \`${escapeHtml(results[item.key])}\`)">
                        📥 Descargar ${item.label}
                    </button>
                </div>`;
            });

            html += '<button class="btn download-btn" style="background: #667eea; margin-top: 20px;" onclick="downloadAll()">📥 Descargar TODO</button>';
            html += '</div>';

            container.innerHTML = html;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function downloadResult(title, content) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(content));
            element.setAttribute('download', `${title}.txt`);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        function downloadAll() {
            let fullContent = '=== TU ESTRATEGIA COMPLETA DE MONETIZACIÓN EN YOUTUBE ===\n\n';

            fullContent += '1. TOP 5 NICHES\n';
            fullContent += allResultsGlobal.niches + '\n\n';

            fullContent += '2. SISTEMA FACELESS\n';
            fullContent += allResultsGlobal.facelessSystem + '\n\n';

            fullContent += '3. TÍTULOS VIRALES\n';
            fullContent += allResultsGlobal.titles + '\n\n';

            fullContent += '4. AUTOMATIZACIÓN IA\n';
            fullContent += allResultsGlobal.automation + '\n\n';

            fullContent += '5. MÚLTIPLES INGRESOS\n';
            fullContent += allResultsGlobal.income + '\n\n';

            fullContent += '6. HACK DEL ALGORITMO\n';
            fullContent += allResultsGlobal.algorithm + '\n\n';

            fullContent += '7. ROADMAP 90 DÍAS\n';
            fullContent += allResultsGlobal.roadmap + '\n\n';

            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(fullContent));
            element.setAttribute('download', 'Estrategia-YouTube-Completa.txt');
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        function showError(message) {
            alert(message);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
